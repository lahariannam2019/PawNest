version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pawnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pawnest
      POSTGRES_PASSWORD: pawnest_dev_password
      POSTGRES_DB: pawnest
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pawnest -d pawnest']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: pawnest-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # Web UI port

  minio:
    image: minio/minio:latest
    container_name: pawnest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web Console
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
